name: CI

# Mantem o CI do T2 no repositorio do T3: testa, constroi as imagens Docker
# e valida os manifests do Kubernetes. O "deploy" e feito no Minikube local
# (scripts/03-deploy.ps1), porque o cluster roda na maquina de quem apresenta.
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  testes:
    name: Testes (${{ matrix.servico }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [estoque-service, pedido-service]
    defaults:
      run:
        working-directory: ${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.servico }}/requirements*.txt

      - name: Instalar dependencias
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
          fi

      - name: Testes automatizados
        run: pytest --cov=app --cov-report=term

  imagens:
    name: Build da imagem (${{ matrix.servico }})
    runs-on: ubuntu-latest
    needs: testes
    strategy:
      fail-fast: false
      matrix:
        servico: [api-gateway, auth-service, estoque-service, pedido-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build (sem publicar)
        run: docker build -t ${{ matrix.servico }}:ci ./${{ matrix.servico }}

  manifests:
    name: Validar manifests do Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Validar k8s/ e k8s-extras/
        run: ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 k8s k8s-extras
