# Ingress = porta de entrada: liga o endereço http://prometheus.local ao Service prometheus.
# Interface do Prometheus (Status > Targets mostra todas as réplicas).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: ecommerce
  labels:
    app: prometheus
    part-of: ecommerce
spec:
  ingressClassName: nginx
  rules:
    - host: prometheus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
