# Secret = dados SENSÍVEIS (senhas, chaves), lidos como variáveis de ambiente.
# Chave de assinatura do JWT e usuários de teste (JSON usuário -> senha).
# Obs.: é um projeto acadêmico, por isso os valores ficam aqui. Em produção,
# eles NÃO iriam para o Git (usam-se Sealed Secrets, Vault etc.).
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: ecommerce
  labels:
    app: auth-service
    part-of: ecommerce
type: Opaque
stringData:
  JWT_SECRET: chave-jwt-do-cluster-projeto-devops
  AUTH_USERS: '{"admin": "123456", "cliente1": "senha123"}'
