# Secret = dados SENSÍVEIS (senhas, chaves), lidos como variáveis de ambiente.
# Credenciais do Postgres do estoque e a DATABASE_URL usada pela aplicação.
# Obs.: é um projeto acadêmico, por isso os valores ficam aqui. Em produção,
# eles NÃO iriam para o Git (usam-se Sealed Secrets, Vault etc.).
apiVersion: v1
kind: Secret
metadata:
  name: estoque-service-secret
  namespace: ecommerce
  labels:
    app: estoque-service
    part-of: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: admin_estoque
  POSTGRES_PASSWORD: pg-estoque-k8s
  POSTGRES_DB: estoque_db
  DATABASE_URL: postgresql://admin_estoque:pg-estoque-k8s@estoque-db:5432/estoque_db
