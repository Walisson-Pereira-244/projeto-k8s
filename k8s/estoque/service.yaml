# Service = endereço fixo dentro do cluster (http://estoque-service:8000)
# que reparte as chamadas entre as réplicas.
apiVersion: v1
kind: Service
metadata:
  name: estoque-service
  namespace: ecommerce
  labels:
    app: estoque-service
    part-of: ecommerce
spec:
  type: ClusterIP
  selector:
    app: estoque-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
