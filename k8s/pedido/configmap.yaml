# ConfigMap = configurações NÃO sensíveis, lidas como variáveis de ambiente.
# O pedido chama o estoque pelo NOME do Service (http://estoque-service:8000).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pedido-service-config
  namespace: ecommerce
  labels:
    app: pedido-service
    part-of: ecommerce
data:
  ENABLE_DOCS: "true"
  ESTOQUE_SERVICE_URL: "http://estoque-service:8000"
  ESTOQUE_TIMEOUT: "30"
