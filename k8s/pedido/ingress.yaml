# Ingress = porta de entrada: liga o endereço http://pedido.local ao Service pedido-service.
# Acesso direto (Swagger do pedido). O caminho oficial é pelo api-gateway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pedido-service-ingress
  namespace: ecommerce
  labels:
    app: pedido-service
    part-of: ecommerce
spec:
  ingressClassName: nginx
  rules:
    - host: pedido.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pedido-service
                port:
                  number: 8000
