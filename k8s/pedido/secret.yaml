# Secret = dados SENSÍVEIS (senhas, chaves), lidos como variáveis de ambiente.
# Credenciais do Postgres do pedido e a DATABASE_URL usada pela aplicação.
# Obs.: é um projeto acadêmico, por isso os valores ficam aqui. Em produção,
# eles NÃO iriam para o Git (usam-se Sealed Secrets, Vault etc.).
apiVersion: v1
kind: Secret
metadata:
  name: pedido-service-secret
  namespace: ecommerce
  labels:
    app: pedido-service
    part-of: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: admin_pedido
  POSTGRES_PASSWORD: pg-pedido-k8s
  POSTGRES_DB: pedido_db
  DATABASE_URL: postgresql://admin_pedido:pg-pedido-k8s@pedido-db:5432/pedido_db
