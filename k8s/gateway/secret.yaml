# Secret = dados SENSÍVEIS (senhas, chaves), lidos como variáveis de ambiente.
# O gateway não guarda dado sensível hoje; o Secret existe para manter o padrão
# de arquivos de todos os serviços e está pronto para receber uma chave.
# Obs.: é um projeto acadêmico, por isso os valores ficam aqui. Em produção,
# eles NÃO iriam para o Git (usam-se Sealed Secrets, Vault etc.).
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: ecommerce
  labels:
    app: api-gateway
    part-of: ecommerce
type: Opaque
stringData:
  GATEWAY_INTERNAL_KEY: reservado-para-uso-futuro
