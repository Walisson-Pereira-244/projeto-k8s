# OPCIONAL - Autoscaling (escalabilidade automatica).
# O HPA aumenta o numero de pods quando o uso de CPU passa de 70% e volta ao
# normal quando a carga cai. Nunca fica abaixo de 2 pods (minimo do enunciado).
# Requer o metrics-server (o script 01-iniciar-cluster.ps1 ja o liga).
# Aplicar:  kubectl apply -f k8s-extras/hpa.yaml
# Remover:  kubectl delete -f k8s-extras/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: estoque-service
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: estoque-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
